<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
     <script>
        
        
        let guess = Number(prompt('guess a number'))
        let attempts =0
        while( guess !== 15 ){
            
            if(guess >=15 ){
                console.log("too high")
            }
            else{
                console.log('too slow')
            }
            attempts++
            if(attempts==5){
                console.log('too much attempts',attempts)
                break
            }
            guess=Number(prompt('guess a number'))
            
            
      }
      if(guess===15){
        console.log(`congrats your guess the number; ${guess}`)

      }
        
        
        
        
    </script>

</body>
</html>
